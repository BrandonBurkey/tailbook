# XcodeGen spec: `brew install xcodegen && xcodegen generate` → TailBook.xcodeproj
# The .xcodeproj is generated (and git-ignored); edit this file, not the project.
name: TailBook

options:
  bundleIdPrefix: com.tailbook
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  developmentLanguage: en
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    # Set your Apple Developer Team ID here (Xcode → Settings → Accounts), or in
    # the target's Signing & Capabilities tab after generating.
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES

packages:
  TailBookEngine:
    path: Packages/TailBookEngine

targets:
  TailBook:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: TailBook
      - path: TailBook.storekit
        buildPhase: none
    dependencies:
      - package: TailBookEngine
    info:
      path: TailBook/Info.plist
      properties:
        CFBundleDisplayName: TailBook
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen:
          UIColorName: PanelBackground
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tailbook.app
        PRODUCT_NAME: TailBook
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
        SUPPORTS_MACCATALYST: NO

  TailBookTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: TailBookTests
      # The engine's golden-vector tests and the vectors file are compiled
      # into this target too, so ⌘U in Xcode proves JS/Swift parity.
      - path: Packages/TailBookEngine/Tests/TailBookEngineTests
    dependencies:
      - target: TailBook
      - package: TailBookEngine
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tailbook.app.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  TailBook:
    build:
      targets:
        TailBook: all
        TailBookTests: [test]
    run:
      config: Debug
      storeKitConfiguration: TailBook.storekit
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - name: TailBookTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
